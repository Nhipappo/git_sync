x-basic-logging: &basic-logging
  logging:
    driver: "json-file"
    options:
      max-size: "32mb"

services:
  # kspd to ext
  gs-kspd-ext:
    <<: *basic-logging
    image: git-sync:latest
    container_name: gs-kspd-ext
    volumes:
      - ./kspd-ext.yaml:/app/config.yaml:ro
      - tmp-kspd:/tmp
    restart: no # always
  # ext to kspd
  gs-ext-kspd:
    <<: *basic-logging
    image: git-sync:latest
    container_name: gs-ext-kspd
    volumes:
      - ./ext-kspd.yaml:/app/config.yaml:ro
      - tmp-ext:/tmp
    restart: no # always

volumes:
  tmp-kspd:
  tmp-ext:
