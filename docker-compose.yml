x-basic-logging: &basic-logging
  logging:
    driver: "json-file"
    options:
      max-size: "32mb"

services:
  git-sync:
    <<: *basic-logging
    image: git-sync:latest
    container_name: git-sync
    volumes:
      - ./configs/config.yaml:/app/src/config.yaml:ro
      - git-sync-tmp:/tmp/git-sync
    restart: always


volumes:
  git-sync-tmp:
